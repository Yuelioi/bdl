[workspace]
resolver = "3"
members = [
  "crates/bdl-core",
  "crates/bdl-tauri",
  "crates/bdl-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["YUELI <yuelioi1210@gmail.com>"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bpi-rs = { version = "0.2.3", default-features = false, features = ["fav", "login", "user", "video"] }
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies", "gzip", "deflate", "brotli"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time", "io-util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
