    "clock",
    "serde",
]

[dependencies.config]
version = "0.15"

[dependencies.flate2]
version = "1.1"
optional = true

[dependencies.hex]
version = "0.4"

[dependencies.hmac]
version = "0.12"

[dependencies.md5]
version = "0.8"

[dependencies.quick-xml]
version = "0.38"
features = ["serialize"]
optional = true

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "cookies",
    "gzip",
    "deflate",
    "brotli",
    "stream",
    "multipart",
    "rustls-tls",
]
default-features = false

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_with]
version = "3.14"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1.35"
