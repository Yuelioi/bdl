name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-check:
    name: Linux x64 build and package checks
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
      - name: Install Linux dependencies
        run: bash scripts/install-linux-deps.sh
      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Check Linux-specific runtime boundaries
        run: |
          cargo test --locked -p bdl-core muxer::tests --lib
          cargo test --locked -p bdl-core --test muxer
          cargo test --locked -p bdl-tauri secure_store::tests --lib
      - name: Build Linux packages without release signing keys
        run: pnpm --dir apps/desktop tauri build --bundles appimage,deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify Linux package contents
        run: bash scripts/verify-linux-packages.sh ./target/release/bundle
      - name: Upload Linux preview packages
        uses: actions/upload-artifact@v4
        with:
          name: bdl-linux-x64
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  check:
    name: Windows workspace checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Install visual test browser
        run: pnpm --dir apps/desktop exec playwright install chromium

      - name: Run workspace checks
        shell: pwsh
        run: ./scripts/check.ps1

      - name: Build Windows application for startup smoke test
        run: pnpm --dir apps/desktop tauri build --no-bundle

      - name: Verify Windows WebView renders application UI
        run: pnpm --dir apps/desktop test:windows-smoke

  macos-check:
    name: macOS workspace and bundle checks
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Run macOS workspace checks
        run: ./scripts/check.sh

      - name: Build macOS application bundle
        run: pnpm --dir apps/desktop tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify macOS application signature
        run: codesign --verify --deep --strict ./target/release/bundle/macos/BDL.app
