name: Publish v0.3.0 recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.3.0-recovery.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Publish existing v0.3.0 draft
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Publish staged release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = 'v0.3.0';
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const release = releases.find(
              ({ tag_name, draft }) => tag_name === tag && draft,
            );
            if (!release) {
              throw new Error(`Draft release for ${tag} was not found.`);
            }
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { ...context.repo, release_id: release.id, per_page: 100 },
            );
            if (assets.length === 0) {
              throw new Error(`Draft release for ${tag} has no staged assets.`);
            }
            core.info(`Publishing ${tag} with ${assets.length} staged assets.`);
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
