name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: node ./scripts/verify-release-tag.mjs "${{ github.ref_name }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build and stage release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: BDL v__VERSION__
          releaseBody: |
            下载适用于 Windows 或 macOS 的安装包。
            macOS 安装包使用 ad-hoc 签名，未经 Apple Developer ID 签名与公证；首次打开请按 README 指引操作。
            应用内更新包使用项目的 Tauri 签名验证完整性。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-gui.ps1 ./target/release/bdl-desktop.exe

      - name: Verify macOS ad-hoc signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="./target/${{ matrix.target }}/release/bundle/macos/BDL.app"
          codesign --verify --deep --strict "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          if [[ "$signature_details" != *"Signature=adhoc"* ]]; then
            echo "Expected an ad-hoc macOS signature." >&2
            exit 1
          fi

  publish:
    name: Publish staged release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const release = releases.find(({ tag_name }) => tag_name === tag);
            if (!release) {
              throw new Error(`Draft release for ${tag} was not found.`);
            }
            const published = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Published ${published.data.tag_name} as the latest release.`);
