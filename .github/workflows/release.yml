name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw apps/desktop/package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match app version '$expectedTag'."
          }

      - name: Find existing GitHub release
        id: existing-release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const tag = context.ref.replace('refs/tags/', '');
            const release = releases.find(({ tag_name }) => tag_name === tag);
            core.setOutput('id', release?.id ?? '');

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Build and stage signed release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ steps.existing-release.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseName: BDL v__VERSION__
          releaseBody: 下载适用于 Windows 的安装包。应用内更新将使用同一发布中的签名清单。
          releaseDraft: true
          prerelease: false

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: ./scripts/verify-windows-gui.ps1 ./target/release/bdl-desktop.exe

      - name: Publish GitHub release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId || steps.existing-release.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId)) {
              throw new Error(`Invalid release ID: ${process.env.RELEASE_ID}`);
            }

            const { data: release } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: releaseId,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Published ${release.tag_name} as the latest release.`);
