[package]
name = "bdl-desktop"
version = "0.12.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "bdl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bdl-core = { path = "../../../crates/bdl-core" }
bdl-tauri = { path = "../../../crates/bdl-tauri" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
url.workspace = true
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2"
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "android")'.dependencies]
bdl-mobile-credentials = { path = "../../../crates/bdl-mobile-credentials" }
bdl-mobile-execution = { path = "../../../crates/bdl-mobile-execution" }
bdl-mobile-media = { path = "../../../crates/bdl-mobile-media" }
bdl-mobile-storage = { path = "../../../crates/bdl-mobile-storage" }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
